[project]
name = "tomato"
version = "0.1.0"
description = "KAMIS 토마토 도매가 3거래일 후 예측 + 설명"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "psycopg[binary]",
    "holidays",
    "lightgbm>=4.7.0",
]

[project.scripts]
tomato = "tomato.cli:main"

[dependency-groups]
dev = ["pytest", "httpx"]
eda = ["matplotlib==3.9.2"]  # scripts/eda_kamis.py
chronos = ["chronos-forecasting==2.3.2", "torch>=2.2"]  # 4단계 Chronos-2 backtest. CPU용 torch

[tool.uv]
default-groups = ["dev", "eda"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
